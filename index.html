<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INLOTRANS · Requisición de Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1220;
  --navy-2:#121D33;
  --panel:#16243F;
  --line-dark:#233252;
  --bg:#F2F3F6;
  --surface:#FFFFFF;
  --ink:#111827;
  --ink-soft:#5B6472;
  --ink-faint:#8992A3;
  --line:#E3E6EC;
  --accent:#FF6A13;
  --accent-dark:#E25A00;
  --accent-soft:#FFE7D6;
  --success:#15803D;
  --success-bg:#DCFCE7;
  --warn:#B45309;
  --warn-bg:#FEF1D6;
  --danger:#B91C1C;
  --danger-bg:#FDE3E1;
  --info:#1D4ED8;
  --info-bg:#DCE6FE;
  --process:#6D28D9;
  --process-bg:#EDE4FE;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  letter-spacing:.02em;
  text-transform:uppercase;
  margin:0;
}
.mono{font-family:'JetBrains Mono',monospace;}
#app{min-height:100vh;}

/* ---------- LOGIN ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
  background:var(--navy);
}
.login-side{
  flex:1.1;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,106,19,.14), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(109,40,217,.16), transparent 50%),
    linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:52px 56px;
  color:#EDEFF4;
  position:relative;
  overflow:hidden;
}
.login-side::after{
  content:"";
  position:absolute; inset:0;
  background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 26px);
  pointer-events:none;
}
.brand-mark{display:flex; align-items:center; gap:14px;}
.brand-chip{
  width:44px;height:44px;border-radius:9px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
  padding:5px;
  flex-shrink:0;
}
.brand-chip img{width:100%;height:100%;object-fit:contain;}
.brand-name{font-family:'Oswald';font-size:19px;letter-spacing:.06em;color:#fff;}
.brand-sub{font-size:11px;color:#9AA4BC;letter-spacing:.14em;margin-top:2px;text-transform:uppercase;}

.pipeline-hero{position:relative;z-index:1;}
.pipeline-hero h1{font-size:40px;line-height:1.08;color:#fff;font-weight:600;max-width:480px;}
.pipeline-hero .accent-word{color:var(--accent);}
.pipeline-hero p{
  font-family:'Inter'; text-transform:none; letter-spacing:0;
  color:#B7BFD4; font-size:15px; max-width:420px; margin-top:16px; line-height:1.6;
}
.stage-track{display:flex; align-items:center; margin-top:38px; gap:0;}
.stage{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 10px 14px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
  margin-right:-13px;
}
.stage .num{font-family:'JetBrains Mono';font-size:11px;color:var(--accent);font-weight:600;}
.stage .lbl{font-family:'Inter';font-size:12.5px;color:#DDE1EC;text-transform:none;letter-spacing:0;font-weight:600;}
.foot-note{position:relative;z-index:1;font-size:11.5px;color:#7C87A0;letter-spacing:.04em;}

.login-side.form{
  flex:.85;
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  padding:40px;
}
.login-card{width:100%;max-width:380px;}
.login-card h2{font-size:15px;color:var(--ink-soft);font-weight:500;letter-spacing:.08em;}
.login-card h1{font-size:28px;color:var(--ink);margin-top:6px;font-weight:600;}
.role-tabs{display:flex;gap:8px;margin:26px 0 22px;}
.role-tab{
  flex:1; text-align:center; padding:12px 6px; border-radius:8px;
  border:1.5px solid var(--line); background:#FAFBFC; cursor:pointer;
  font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--ink-soft);
  text-transform:uppercase; font-family:'Inter'; transition:.15s;
}
.role-tab.active{
  border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);
}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);
  text-transform:uppercase; letter-spacing:.06em; margin-bottom:7px;
}
.field input,.field select,.field textarea{
  width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:8px;
  font-size:14.5px; font-family:'Inter'; color:var(--ink); background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}
.field input[type="checkbox"]{width:auto;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:8px; border:none; cursor:pointer;
  font-family:'Inter'; font-weight:700; font-size:13.5px; letter-spacing:.02em;
  transition:.15s;
}
.btn:disabled{opacity:.6; cursor:not-allowed;}
.btn-primary{background:var(--accent); color:#fff; width:100%;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink-soft);}
.btn-ghost:hover{border-color:var(--ink-faint); color:var(--ink);}
.btn-outline-accent{background:#fff;border:1.5px solid var(--accent);color:var(--accent-dark);}
.btn-outline-accent:hover{background:var(--accent-soft);}
.btn-success{background:var(--success); color:#fff;}
.btn-success:hover{background:#116830;}
.btn-danger{background:transparent;border:1.5px solid var(--danger); color:var(--danger);}
.btn-danger:hover{background:var(--danger-bg);}
.btn-sm{padding:8px 14px;font-size:12.5px;}
.err-msg{
  background:var(--danger-bg); color:var(--danger); font-size:13px; padding:10px 13px;
  border-radius:8px; margin-bottom:16px; font-weight:600;
}
.demo-creds{
  margin-top:22px; padding:13px 14px; background:#F7F8FA; border-radius:8px;
  font-size:11.5px; color:var(--ink-faint); line-height:1.7; border:1px dashed var(--line);
}
.demo-creds b{color:var(--ink-soft); font-family:'JetBrains Mono';}

/* ---------- APP SHELL ---------- */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:240px; background:var(--navy); color:#fff; flex-shrink:0;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:26px 0;
}
.sidebar-top .brand-mark{padding:0 22px 26px; border-bottom:1px solid var(--line-dark);}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:13px 22px;
  font-family:'Inter'; font-size:13.5px; font-weight:600; color:#AEB6C9;
  cursor:pointer; border-left:3px solid transparent;
}
.nav-item:hover{color:#fff; background:rgba(255,255,255,.03);}
.nav-item.active{color:#fff; background:rgba(255,106,19,.12); border-left-color:var(--accent);}
.nav-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6;}
.nav-section{padding:20px 22px 8px; font-size:10.5px; letter-spacing:.12em; color:#5C6684; text-transform:uppercase; font-weight:700; font-family:'Oswald';}
.sidebar-bottom{padding:0 22px;}
.user-chip{
  display:flex; align-items:center; gap:10px; padding:12px; background:var(--panel);
  border-radius:9px; margin-bottom:10px;
}
.user-avatar{
  width:34px;height:34px;border-radius:50%; background:linear-gradient(135deg,var(--accent),#B33F00);
  display:flex;align-items:center;justify-content:center; font-family:'Oswald'; font-weight:600; color:#fff; font-size:13px; flex-shrink:0;
}
.user-info .uname{font-size:12.5px; font-weight:700; color:#fff;}
.user-info .urole{font-size:10.5px; color:#8D97AE; text-transform:uppercase; letter-spacing:.05em;}
.logout-link{
  width:100%; text-align:left; background:none; border:none; color:#8D97AE; font-size:12px;
  font-family:'Inter'; font-weight:600; cursor:pointer; padding:8px 4px;
}
.logout-link:hover{color:var(--accent);}

.main{flex:1; padding:34px 40px; max-width:1180px;}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
.page-head h1{font-size:24px; color:var(--ink); font-weight:600;}
.page-head .sub{font-family:'Inter'; text-transform:none; letter-spacing:0; color:var(--ink-soft); font-size:13.5px; margin-top:4px;}
.page-head-actions{display:flex; gap:10px; align-items:center;}

.stat-row{display:flex; gap:14px; margin-bottom:28px; flex-wrap:wrap;}
.stat-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 20px; min-width:140px; flex:1;
}
.stat-card .n{font-family:'Oswald'; font-size:28px; font-weight:600; color:var(--ink);}
.stat-card .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-top:2px;}
.stat-card.accent{border-color:var(--accent); background:var(--accent-soft);}
.stat-card.accent .n{color:var(--accent-dark);}

.tabs-row{display:flex; gap:6px; margin-bottom:22px; border-bottom:1.5px solid var(--line);}
.tab-btn{
  padding:11px 4px; margin-right:22px; background:none; border:none; cursor:pointer;
  font-family:'Inter'; font-size:13.5px; font-weight:700; color:var(--ink-faint);
  border-bottom:2.5px solid transparent; margin-bottom:-1.5px;
}
.tab-btn.active{color:var(--ink); border-bottom-color:var(--accent);}
.tab-count{
  background:var(--line); color:var(--ink-soft); font-size:10.5px; padding:1px 7px;
  border-radius:20px; margin-left:6px; font-family:'JetBrains Mono';
}
.tab-btn.active .tab-count{background:var(--accent-soft); color:var(--accent-dark);}

/* form card */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 28px; margin-bottom:20px;
}
.card h3{font-size:13px; color:var(--ink-soft); letter-spacing:.08em; margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--line);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px 20px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px 20px;}
.span2{grid-column:span 2;}
.hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.readonly-field{
  padding:11px 13px; border:1.5px dashed var(--line); border-radius:8px; font-size:14px;
  background:#FAFBFC; color:var(--ink-soft);
}
.checkbox-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.checkbox-row label{margin:0; text-transform:none; font-weight:600; font-size:13px; color:var(--ink); letter-spacing:0;}

/* requisicion list cards */
.req-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 22px; margin-bottom:14px;
}
.req-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:14px;}
.req-id{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--ink-faint); font-weight:600;}
.req-title{font-family:'Oswald'; font-size:17px; font-weight:600; color:var(--ink); margin-top:3px; text-transform:none; letter-spacing:0;}
.req-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px;
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;
}
.badge.pend{background:var(--warn-bg); color:var(--warn);}
.badge.appr{background:var(--info-bg); color:var(--info);}
.badge.rej{background:var(--danger-bg); color:var(--danger);}
.badge.proc{background:var(--process-bg); color:var(--process);}
.badge.done{background:var(--success-bg); color:var(--success);}
.badge.cliente{background:var(--process-bg); color:var(--process);}

.req-details{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:14px 0;}
.detail-item .l{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
.detail-item .v{font-size:13.5px; color:var(--ink); margin-top:3px; font-weight:600;}
.detail-item.wide{grid-column:span 4;}
.detail-item .v.small{font-weight:400; font-size:13px; color:var(--ink-soft);}
.captura-thumb{max-width:220px; max-height:150px; border-radius:8px; border:1px solid var(--line); margin-top:8px; display:block; cursor:pointer;}

.pipe{display:flex; align-items:center; gap:0; margin-bottom:6px;}
.pipe-step{
  font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:5px 12px 5px 10px; color:var(--ink-faint); background:#F1F2F5;
  clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%);
  margin-right:-7px;
}
.pipe-step.on{background:var(--accent); color:#fff;}
.pipe-step.done{background:#2E3B58; color:#fff;}
.pipe-step.rejected{background:var(--danger); color:#fff;}

.req-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
.reject-box{margin-top:12px; display:none;}
.reject-box.show{display:block;}
.empty-state{
  text-align:center; padding:60px 20px; color:var(--ink-faint);
}
.empty-state .big{font-family:'Oswald'; font-size:16px; color:var(--ink-soft); margin-bottom:6px; text-transform:none;}
.toast{
  position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff; padding:14px 20px;
  border-radius:9px; font-size:13.5px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25);
  z-index:999; display:flex; align-items:center; gap:10px; border-left:4px solid var(--success);
  animation:slideup .25s ease;
}
.toast.err{border-left-color:var(--danger);}
@keyframes slideup{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:900px){
  .login-wrap{flex-direction:column;}
  .login-side{padding:32px 26px;}
  .stage-track{flex-wrap:wrap; gap:8px;}
  .shell{flex-direction:column;}
  .sidebar{width:100%; flex-direction:row; align-items:center; padding:14px 18px; overflow-x:auto;}
  .sidebar-top,.sidebar-bottom{display:flex; align-items:center; gap:6px;}
  .sidebar-top .brand-mark{border:none; padding:0; margin-right:10px;}
  .nav-item{border-left:none; border-bottom:2.5px solid transparent; padding:8px 12px; white-space:nowrap;}
  .nav-item.active{border-left:none; border-bottom-color:var(--accent);}
  .nav-section{display:none;}
  .main{padding:22px 18px;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .req-details{grid-template-columns:1fr 1fr;}
  .detail-item.wide{grid-column:span 2;}
}
</style>
</head>

async function loadRequisiciones(){
  state.loading = true;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=list');
    const data = await res.json();
    state.requisiciones = Array.isArray(data) ? data : [];
  }catch(e){
    state.requisiciones = state.requisiciones || [];
    showToast('No se pudo conectar con el servidor de datos. Verifica tu conexión.', true);
  }
  state.loaded = true;
  state.loading = false;
}

async function apiCreateRequisicion(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS con Apps Script
    body: JSON.stringify({action:'create', payload})
  });
  return res.json();
}

function attachLoginEvents(){
  document.querySelectorAll('.role-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ state.loginRole = el.dataset.role; state.loginError=''; render(); });
  });
  const form = document.getElementById('login-form');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const u = document.getElementById('login-user').value.trim().toLowerCase();
    const p = document.getElementById('login-pass').value;
    const found = USERS.find(x=>x.usuario===u && x.password===p && x.rol===state.loginRole);
    if(!found){
      state.loginError = 'Usuario, contraseña o rol incorrectos. Verifica e intenta de nuevo.';
      render();
      return;
    }
    state.user = found;
    state.loginError = '';
    state.view = 'dashboard';
    await loadRequisiciones();
    render();
  });
}

/* ============================================================
   APP SHELL
   ============================================================ */
function navItemsFor(role){
  if(role==='coordinador') return [
    {id:'dashboard', label:'Resumen'},
    {id:'nueva', label:'Nueva requisición'},
    {id:'mis', label:'Mis requisiciones'},
  ];
  if(role==='gerencia') return [
    {id:'dashboard', label:'Resumen'},
    {id:'pendientes', label:'Pendientes de aprobación'},
    {id:'historial', label:'Historial general'},
  ];
  return [
    {id:'dashboard', label:'Resumen'},
    {id:'iniciar', label:'Para iniciar búsqueda'},
    {id:'proceso', label:'En proceso'},
    {id:'historial', label:'Historial general'},
  ];
}

function renderShell(){
  const role = state.user.rol;
  const items = navItemsFor(role);
  const initials = state.user.nombre.replace(/^Coordinador — /,'').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return `
  <div class="shell">
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="brand-mark">
          <div class="brand-chip"><img src="${LOGO_ICON}" alt="Inlotrans"></div>
          <div>
            <div class="brand-name" style="font-size:15px;">INLOTRANS</div>
            <div class="brand-sub" style="font-size:9.5px;">Requisición de personal</div>
          </div>
        </div>
        <div class="nav-section">Navegación</div>
        ${items.map(it=>`
          <div class="nav-item ${state.view===it.id?'active':''}" data-view="${it.id}">
            <span class="nav-dot"></span>${it.label}
          </div>`).join('')}
      </div>
      <div class="sidebar-bottom">
        <div class="user-chip">

function attachShellEvents(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.view = el.dataset.view;
      if(state.view !== 'nueva'){ render(); await loadRequisiciones(); render(); }
      else{ render(); }
    });
  });
  document.getElementById('logout-btn').addEventListener('click', ()=>{
    state.user = null; render();
  });
  attachMainEvents();
}

/* ============================================================
   MAIN CONTENT ROUTER
   ============================================================ */
function renderMain(){
  const role = state.user.rol;
  if(state.view==='dashboard') return renderDashboard();
  if(role==='coordinador'){
    if(state.view==='nueva') return renderNuevaRequisicion();
    if(state.view==='mis') return renderListado(state.requisiciones.filter(r=>r.solicitanteUsuario===state.user.usuario), 'Mis requisiciones', 'Historial de las requisiciones que has solicitado.');
  }
  if(role==='gerencia'){
    if(state.view==='pendientes') return renderListado(state.requisiciones.filter(r=>r.estado===STATUS.PEND), 'Pendientes de aprobación', 'Requisiciones esperando tu decisión.', true);
    if(state.view==='historial') return renderListado(state.requisiciones, 'Historial general', 'Todas las requisiciones registradas en el sistema.');
  }
  if(role==='rh'){
    if(state.view==='iniciar') return renderListado(state.requisiciones.filter(r=>r.estado===STATUS.APPR), 'Para iniciar búsqueda', 'Requisiciones aprobadas por gerencia, listas para iniciar selección.', false, true);
    if(state.view==='proceso') return renderListado(state.requisiciones.filter(r=>r.estado===STATUS.PROC), 'En proceso de búsqueda', 'Vacantes que RH está gestionando actualmente.', false, true);
    if(state.view==='historial') return renderListado(state.requisiciones, 'Historial general', 'Todas las requisiciones registradas en el sistema.');
  }
  return renderDashboard();
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const role = state.user.rol;
  const all = state.requisiciones;
  const mine = all.filter(r=>r.solicitanteUsuario===state.user.usuario);
  const counts = {
    pend: all.filter(r=>r.estado===STATUS.PEND).length,
    appr: all.filter(r=>r.estado===STATUS.APPR).length,
    proc: all.filter(r=>r.estado===STATUS.PROC).length,
    done: all.filter(r=>r.estado===STATUS.DONE).length,
    rej: all.filter(r=>r.estado===STATUS.REJ).length,
  };
  let stats = '';
  if(role==='coordinador'){
    stats = `
      <div class="stat-row">
        <div class="stat-card"><div class="n">${mine.length}</div><div class="l">Mis requisiciones</div></div>
        <div class="stat-card accent"><div class="n">${mine.filter(r=>r.estado===STATUS.PEND).length}</div><div class="l">Pendientes de gerencia</div></div>
        <div class="stat-card"><div class="n">${mine.filter(r=>r.estado===STATUS.PROC||r.estado===STATUS.APPR).length}</div><div class="l">En búsqueda por RH</div></div>
        <div class="stat-card"><div class="n">${mine.filter(r=>r.estado===STATUS.DONE).length}</div><div class="l">Vacantes cubiertas</div></div>
      </div>`;
  } else if(role==='gerencia'){
    stats = `
      <div class="stat-row">
        <div class="stat-card accent"><div class="n">${counts.pend}</div><div class="l">Por aprobar</div></div>
        <div class="stat-card"><div class="n">${counts.appr+counts.proc}</div><div class="l">En gestión de RH</div></div>
        <div class="stat-card"><div class="n">${counts.done}</div><div class="l">Cubiertas</div></div>
        <div class="stat-card"><div class="n">${counts.rej}</div><div class="l">Rechazadas</div></div>
      </div>`;
  } else {
    stats = `
      <div class="stat-row">
        <div class="stat-card accent"><div class="n">${counts.appr}</div><div class="l">Por iniciar búsqueda</div></div>
        <div class="stat-card"><div class="n">${counts.proc}</div><div class="l">En proceso</div></div>
        <div class="stat-card"><div class="n">${counts.done}</div><div class="l">Cubiertas</div></div>
        <div class="stat-card"><div class="n">${counts.pend}</div><div class="l">Pendientes en gerencia</div></div>
      </div>`;
  }

  const recent = [...all].sort((a,b)=> new Date(b.fechaSolicitud)-new Date(a.fechaSolicitud)).slice(0,5);

  return `
    <div class="page-head">
      <div><h1>Hola, ${state.user.nombre.replace(/^Coordinador — /,'').split(' ')[0]}</h1><div class="sub">${ROLE_LABEL[role]} · ${todayLabel()}</div></div>
      <div class="page-head-actions">
        <button class="btn btn-ghost btn-sm" id="refresh-btn">${state.loading ? '<span class="spin"></span>' : '↻'} Actualizar</button>
        ${role==='coordinador' ? `<button class="btn btn-primary" id="dash-new-btn" style="width:auto;">+ Nueva requisición</button>` : ''}
      </div>
    </div>
    ${stats}
    <div class="card">
      <h3>Actividad reciente</h3>
      ${recent.length===0 ? emptyState('Aún no hay requisiciones registradas.') : recent.map(r=>reqSummaryRow(r)).join('')}
    </div>
  `;
}
function todayLabel(){
  return new Date().toLocaleDateString('es-CO',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}
function reqSummaryRow(r){
  return `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);">
    <div>

    </div>

}

/* ---------- LISTADO (usado por varios roles) ---------- */
function renderListado(list, title, subtitle, gerenciaActions=false, rhActions=false){
  const sorted = [...list].sort((a,b)=> new Date(b.fechaSolicitud)-new Date(a.fechaSolicitud));
  return `
    <div class="page-head">
      <div><h1>${title}</h1><div class="sub">${subtitle}</div></div>
      <div class="page-head-actions">
        <button class="btn btn-ghost btn-sm" id="refresh-btn">${state.loading ? '<span class="spin"></span>' : '↻'} Actualizar</button>
      </div>
    </div>
    ${sorted.length===0 ? emptyState('No hay requisiciones en esta vista por el momento.') : sorted.map(r=>renderReqCard(r, gerenciaActions, rhActions)).join('')}
  `;
}

function emptyState(msg){
  return `<div class="empty-state"><div class="big">Nada por aquí todavía</div>${msg}</div>`;
}

function badgeFor(estado){
  const map = {
    [STATUS.PEND]: 'pend', [STATUS.APPR]: 'appr', [STATUS.REJ]: 'rej',
    [STATUS.PROC]: 'proc', [STATUS.DONE]: 'done',
  };
  return `<span class="badge ${map[estado]}">${estado}</span>`;
}

function pipelineFor(r){
  const stageOrder = ['Solicitud','Aprobación','Búsqueda RH','Cubierta'];
  let activeIdx = 0;
  if(r.estado===STATUS.PEND) activeIdx=1;
  else if(r.estado===STATUS.APPR) activeIdx=2;
  else if(r.estado===STATUS.PROC) activeIdx=2;
  else if(r.estado===STATUS.DONE) activeIdx=4;
  const rejected = r.estado===STATUS.REJ;
  return `<div class="pipe">${stageOrder.map((s,i)=>{
    let cls='';
    if(rejected && i===1) cls='rejected';
    else if(i < activeIdx) cls='done';
    else if(i === activeIdx) cls='on';
    return `<div class="pipe-step ${cls}">${s}</div>`;
  }).join('')}</div>`;
}

function renderReqCard(r, gerenciaActions, rhActions){
  return `
  <div class="req-card" data-id="${r.id}">
    <div class="req-top">
      <div>
        <div class="req-id">REQ-${r.consecutivo} · Solicitada ${fmtDate(r.fechaSolicitud)}</div>
        <div class="req-title">${r.cargo} — ${r.operacionNombre} ${r.clienteSolicito ? '<span class="badge cliente">Pedido por cliente</span>' : ''}</div>
        <div class="req-sub">${r.ciudad} · ${r.vacantes} vacante(s) · Coordinador: ${r.solicitanteNombre} (${r.solicitanteCargo})</div>
      </div>
      ${badgeFor(r.estado)}
    </div>
    ${pipelineFor(r)}
    <div class="req-details">
      <div class="detail-item"><div class="l">Coordinador</div><div class="v small">${r.solicitanteNombre}</div></div>
      <div class="detail-item"><div class="l">Motivo</div><div class="v small">${r.motivo}</div></div>
      <div class="detail-item"><div class="l">Ingreso requerido</div><div class="v small">${fmtDate(r.fechaIngreso)}</div></div>
      <div class="detail-item"><div class="l">Correo solicitante</div><div class="v small">${r.solicitanteCorreo}</div></div>
      <div class="detail-item wide"><div class="l">Experiencia requerida</div><div class="v small">${r.experiencia}</div></div>
      ${r.aspectos ? `<div class="detail-item wide"><div class="l">Aspectos relevantes del cargo</div><div class="v small">${r.aspectos}</div></div>` : ''}
      ${r.comentarioGerencia ? `<div class="detail-item wide"><div class="l">Comentario de gerencia</div><div class="v small">${r.comentarioGerencia}</div></div>` : ''}
      ${r.clienteSolicito ? `
      <div class="detail-item wide">
        <div class="l">Solicitud del cliente</div>
        <div class="v small">${r.clienteNombre || '—'} · ${r.clienteCorreo || '—'}</div>
        ${r.capturaDataUrl ? `<a href="${r.capturaDataUrl}" target="_blank"><img src="${r.capturaDataUrl}" class="captura-thumb" alt="Captura de solicitud del cliente"></a>` : `<div class="hint">Sin captura adjunta.</div>`}
      </div>` : ''}
    </div>
    ${gerenciaActions && r.estado===STATUS.PEND ? `
      <div class="req-actions">
        <button class="btn btn-success btn-sm approve-btn" data-id="${r.id}">✓ Aprobar</button>
        <button class="btn btn-danger btn-sm reject-toggle-btn" data-id="${r.id}">✕ Rechazar</button>
      </div>
      <div class="reject-box" id="reject-box-${r.id}">
        <textarea placeholder="Motivo del rechazo (obligatorio)" rows="2" id="reject-reason-${r.id}" style="width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font-family:'Inter'; font-size:13.5px; margin-top:4px;"></textarea>
        <button class="btn btn-danger btn-sm confirm-reject-btn" data-id="${r.id}" style="margin-top:8px;">Confirmar rechazo</button>
      </div>
    ` : ''}
    ${rhActions && r.estado===STATUS.APPR ? `
      <div class="req-actions">
        <button class="btn btn-primary btn-sm start-search-btn" data-id="${r.id}" style="width:auto;">Iniciar búsqueda</button>
      </div>
    ` : ''}
    ${rhActions && r.estado===STATUS.PROC ? `
      <div class="req-actions">
        <button class="btn btn-success btn-sm close-vacancy-btn" data-id="${r.id}">✓ Marcar vacante cubierta</button>
      </div>
    ` : ''}
  </div>`;
}

/* ============================================================
   MAIN EVENTS
   ============================================================ */
function attachMainEvents(){
  const refreshBtn = document.getElementById('refresh-btn');
  if(refreshBtn) refreshBtn.addEventListener('click', async ()=>{ await loadRequisiciones(); render(); });

  const newBtn = document.getElementById('dash-new-btn');
  if(newBtn) newBtn.addEventListener('click', ()=>{ pendingCaptura = null; state.view='nueva'; render(); });

  const form = document.getElementById('nueva-req-form');
  if(form){

    const cargoSelect = document.getElementById('f-cargo');
    if(cargoSelect){
      cargoSelect.addEventListener('change', ()=>{
        const key = baseCargoKey(cargoSelect.value);
        const comp = CARGO_COMPETENCIAS[key];
        const expEl = document.getElementById('f-experiencia');
        const aspEl = document.getElementById('f-aspectos');
        if(comp){
          expEl.value = comp.experiencia;
          aspEl.value = comp.aspectos;
        } else {
          expEl.value = '';
          aspEl.value = '';
        }
      });
    }

    const clienteCheckbox = document.getElementById('f-cliente-solicito');
    if(clienteCheckbox){
      clienteCheckbox.addEventListener('change', ()=>{
        document.getElementById('cliente-fields-wrap').style.display = clienteCheckbox.checked ? 'block' : 'none';
      });
    }

    const capturaInput = document.getElementById('f-cliente-captura');
    if(capturaInput){
      capturaInput.addEventListener('change', ()=>{
        const file = capturaInput.files[0];
        const hintEl = document.getElementById('captura-preview-hint');
        if(!file) return;
        if(file.size > 2*1024*1024){
          showToast('La imagen es muy pesada (máx. 2MB). Usa una captura más liviana.', true);
          capturaInput.value = '';
          pendingCaptura = null;
          hintEl.textContent = 'Adjunta el pantallazo del correo, chat o mensaje donde el cliente solicita el cargo.';
          return;
        }
        const reader = new FileReader();
        reader.onload = ()=>{
          pendingCaptura = { dataUrl: reader.result, fileName: file.name };
          hintEl.textContent = 'Archivo cargado: ' + file.name;
        };
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();

      const clienteCheckboxEl = document.getElementById('f-cliente-solicito');
      const clienteSolicito = clienteCheckboxEl ? clienteCheckboxEl.checked : false;
      let clienteNombre = '', clienteCorreo = '';
      if(clienteSolicito){
        clienteNombre = document.getElementById('f-cliente-nombre').value.trim();
        clienteCorreo = document.getElementById('f-cliente-correo').value.trim();
        if(!clienteNombre || !clienteCorreo){
          showToast('Indica el nombre y el correo de quien solicitó el cargo por parte del cliente.', true);
          return;
        }
        if(!pendingCaptura){
          showToast('Adjunta la captura de pantalla que evidencia la solicitud del cliente.', true);
          return;
        }
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando…';

      const payload = {
        operacionCode: state.user.operacionCode,
        operacionNombre: state.user.operacionNombre,
        ciudad: document.getElementById('f-ciudad').value,
        cargo: document.getElementById('f-cargo').value,
        vacantes: parseInt(document.getElementById('f-vacantes').value || '1'),
        experiencia: document.getElementById('f-experiencia').value.trim(),
        fechaIngreso: document.getElementById('f-fecha-ingreso').value,
        aspectos: document.getElementById('f-aspectos').value.trim(),
        motivo: document.getElementById('f-motivo').value,
        solicitanteUsuario: state.user.usuario,
        solicitanteNombre: state.user.nombre.replace(/^Coordinador — /,''),
        solicitanteCorreo: state.user.correo,
        solicitanteCargo: state.user.cargo,
        fechaSolicitud: todayISO(),
        clienteSolicito: clienteSolicito,
        clienteNombre: clienteSolicito ? clienteNombre : '',
        clienteCorreo: clienteSolicito ? clienteCorreo : '',
        capturaDataUrl: clienteSolicito && pendingCaptura ? pendingCaptura.dataUrl : '',
        capturaFileName: clienteSolicito && pendingCaptura ? pendingCaptura.fileName : '',
      };

      try{
        const result = await apiCreateRequisicion(payload);
        if(result && result.ok){
          pendingCaptura = null;
          showToast(`Requisición #${result.consecutivo} enviada a Gerencia.`);
          await loadRequisiciones();
          state.view = 'mis';
          render();
        } else {
          showToast('No se pudo enviar la requisición. Intenta de nuevo.', true);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enviar a Gerencia';
        }
      }catch(err){
        showToast('Error de conexión al enviar la requisición.', true);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar a Gerencia';
      }
    });
  }
  const cancelBtn = document.getElementById('cancel-new-btn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ pendingCaptura = null; state.view='dashboard'; render(); });

  document.querySelectorAll('.approve-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>updateEstado(btn.dataset.id, STATUS.APPR, 'Aprobada por Gerencia'));
  });
  document.querySelectorAll('.reject-toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('reject-box-'+btn.dataset.id).classList.toggle('show');
    });
  });
  document.querySelectorAll('.confirm-reject-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const reason = document.getElementById('reject-reason-'+id).value.trim();
      if(!reason){ showToast('Escribe un motivo de rechazo.', true); return; }
      await updateEstado(id, STATUS.REJ, 'Rechazada por Gerencia: '+reason, reason);
    });
  });
  document.querySelectorAll('.start-search-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>updateEstado(btn.dataset.id, STATUS.PROC, 'RH inició la búsqueda de personal'));
  });
  document.querySelectorAll('.close-vacancy-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>updateEstado(btn.dataset.id, STATUS.DONE, 'Vacante cubierta por RH'));
  });
}

async function updateEstado(id, nuevoEstado, accionTxt, comentario){
  const payload = {
    id, estado: nuevoEstado,
    comentarioGerencia: comentario !== undefined ? comentario : undefined,
    fecha: todayISO(), accionTxt, usuario: state.user.nombre.replace(/^Coordinador — /,'')
  };
  try{
    const res = await apiUpdateEstado(payload);
    if(res && res.ok){
      showToast('Actualizado: ' + nuevoEstado);
      await loadRequisiciones();
      render();
    } else {
      showToast('No se pudo actualizar. Intenta de nuevo.', true);
    }
  }catch(err){
    showToast('Error de conexión al actualizar.', true);
  }
}

function showToast(msg, isErr=false){
  const holder = document.getElementById('toast-holder');
  if(!holder) return;
  holder.innerHTML = `<div class="toast ${isErr?'err':''}">${isErr?'⚠':'✓'} ${msg}</div>`;
  setTimeout(()=>{ if(holder) holder.innerHTML=''; }, 3200);
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  render();
})();
</script>
